<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Delivery System</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="cadastro-empresa.html">Empresas</a>

        <a href="cadastro-produto.html">Produtos</a>

    </nav>

</header>

<div class="container">

    <div class="form-card">

        <h2>Cadastro de Produto</h2>

        <form id="produtoForm">

            <div class="form-group">

                <label>ID da Empresa</label>

                <input
                    type="text"
                    id="empresaId"
                    required
                >

            </div>

            <div class="form-group">

                <label>Nome do Produto</label>

                <input
                    type="text"
                    id="nome"
                    required
                >

            </div>

            <div class="form-group">

                <label>Categoria</label>

                <input
                    type="text"
                    id="categoria"
                    required
                >

            </div>

            <div class="form-group">

                <label>Descrição</label>

                <textarea
                    id="descricao"
                    rows="4"
                    required
                ></textarea>

            </div>

            <div class="form-group">

                <label>Preço</label>

                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    required
                >

            </div>

            <button type="submit">

                Cadastrar Produto

            </button>

        </form>

        <p id="mensagem"></p>

    </div>

    <div id="listaProdutos" class="lista"></div>

</div>

<script src="js/produto.js"></script>

</body>
</html>
