<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Empresas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>Delivery System</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="cadastro-empresa.html">Empresas</a>
        <a href="cadastro-produto.html">Produtos</a>
    </nav>

</header>

<div class="container">

    <div class="form-card">

        <h2>Cadastro de Empresa</h2>

        <form id="empresaForm">

            <div class="form-group">
                <label>Nome da Empresa</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label>Tipo do Comércio</label>
                <input type="text" id="tipo" required>
            </div>

            <div class="form-group">
                <label>Taxa de Entrega</label>
                <input type="number" id="frete" required>
            </div>

            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="endereco" required>
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="telefone" required>
            </div>

            <div class="form-group">
                <label>Horário de Funcionamento</label>
                <input type="text" id="horario" required>
            </div>

            <button type="submit">
                Cadastrar Empresa
            </button>

        </form>

        <p id="mensagem"></p>

    </div>

    <div class="lista" id="listaEmpresas"></div>

</div>

<script src="js/empresa.js"></script>

</body>
</html>
